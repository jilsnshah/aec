# Render Blueprint: one web service that runs the API and serves the web app.
# The database is on Neon (PostgreSQL); its connection string is a secret set
# in the Render dashboard as DATABASE_URL -- use Neon's direct (non-pooled)
# endpoint, because the app sets per-connection timeouts.
#
# Free plan, for trying it out: the service sleeps after 15 minutes idle.
# For real use switch the plan to "starter".
services:
  - type: web
    name: aec
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      # Encrypts integration credentials (AI key, email password) at rest.
      # Generated once; keep it, or saved credentials must be entered again.
      - key: SECRET_KEY
        generateValue: true
      # AI credentials, set by the administrator; users only pick the model.
      # Gemini on Vertex AI (express-mode key "AQ...") and/or Claude.
      - key: VERTEX_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # The first admin, created once at startup when no user exists.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      # The web app is served from the same origin, so no other origins.
      - key: CORS_ORIGINS
        value: ""
      # Neon's free tier allows few direct connections; one process needs few.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
